group = "io.issuetracker.issuetracker_sdk"
version = "0.5.0"

buildscript {
    ext.kotlin_version = "2.0.21"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "io.issuetracker.issuetracker_sdk"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        // Native Android SDK requires API 26+, so the wrapper does too.
        minSdk = 26
    }

    dependencies {
        // Native Android SDK that this wrapper bridges to.
        // For local dev: cd ../../sdk-android && ./gradlew :sdk:publishToMavenLocal
        // 0.6.0: tester attestation (ADR-0005) — setTesterToken/clearTesterToken.
        implementation("no.issuetracker:sdk:0.6.0")

        // JUnit 4 is the runner Android unit tests use by default. It is
        // declared explicitly because the previous config called
        // useJUnitPlatform() without a JUnit 5 engine on the classpath,
        // which makes the task run zero tests and still report success.
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        // The plugin constructor touches android.os.Looper. Without this,
        // every android.jar stub throws "not mocked" and the dispatch
        // tests cannot construct the plugin at all.
        unitTests.returnDefaultValues = true

        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}
